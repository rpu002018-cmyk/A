<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PU College Admission - Student Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --light-bg: #f3f4f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container-wrapper {
            width: 100%;
            max-width: 900px;
        }

        .portal-header {
            background: white;
            padding: 30px;
            border-radius: 15px 15px 0 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            border-bottom: 4px solid var(--primary-color);
        }

        .portal-header h1 {
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .portal-header p {
            color: #6b7280;
            font-size: 14px;
            margin: 0;
        }

        .portal-body {
            background: white;
            padding: 40px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .search-section {
            margin-bottom: 40px;
        }

        .search-section label {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 12px;
            display: block;
            font-size: 16px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-box button {
            padding: 12px 30px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .search-box button:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .search-box button:active {
            transform: translateY(0);
        }

        .results-section {
            display: none;
        }

        .results-section.active {
            display: block;
            animation: slideInUp 0.4s ease;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-admitted {
            background-color: #d1fae5;
            color: #065f46;
        }

        .status-allotted {
            background-color: #dbeafe;
            color: #0c4a6e;
        }

        .status-waiting {
            background-color: #fef3c7;
            color: #78350f;
        }

        .status-registered {
            background-color: #e0e7ff;
            color: #3730a3;
        }

        .status-rejected {
            background-color: #fee2e2;
            color: #7f1d1d;
        }

        .result-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            border-left: 6px solid var(--primary-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .result-header h2 {
            color: var(--primary-color);
            font-size: 22px;
            font-weight: 700;
            margin: 0;
            flex: 1;
            min-width: 250px;
        }

        .result-status {
            text-align: right;
        }

        .result-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .detail-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
        }

        .detail-label {
            color: #6b7280;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            display: block;
        }

        .detail-value {
            color: #1f2937;
            font-size: 16px;
            font-weight: 600;
        }

        .choices-container {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .choices-container h4 {
            color: #1f2937;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .choices-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .choice-badge {
            background: var(--primary-color);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .error-message {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid #dc2626;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .error-message i {
            font-size: 20px;
        }

        .success-message {
            background-color: #d1fae5;
            color: #065f46;
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid #10b981;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .success-message i {
            font-size: 20px;
        }

        .loader {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .loader.active {
            display: block;
        }

        .spinner {
            border: 4px solid var(--light-bg);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .portal-footer {
            background: white;
            padding: 20px 40px;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            color: #6b7280;
            font-size: 13px;
            border-top: 1px solid #e5e7eb;
        }

        .info-box {
            background: #eff6ff;
            border-left: 4px solid var(--primary-color);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .info-box i {
            color: var(--primary-color);
            margin-right: 10px;
            font-size: 16px;
        }

        .info-box p {
            color: #0c4a6e;
            font-size: 14px;
            margin: 0;
        }

        .admission-slip {
            background: white;
            border: 2px dashed #d1d5db;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            page-break-inside: avoid;
        }

        .admission-slip h3 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .slip-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        .slip-row:last-child {
            border-bottom: none;
        }

        .slip-label {
            font-weight: 600;
            color: #374151;
        }

        .slip-value {
            color: #1f2937;
        }

        .print-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            margin-top: 15px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .print-btn:hover {
            background: var(--secondary-color);
        }

        @media (max-width: 768px) {
            .portal-header {
                padding: 20px;
            }

            .portal-header h1 {
                font-size: 22px;
            }

            .portal-body {
                padding: 20px;
            }

            .search-box {
                flex-direction: column;
            }

            .result-details {
                grid-template-columns: 1fr;
            }

            .result-header {
                flex-direction: column;
            }

            .result-status {
                text-align: left;
            }
        }

        @media print {
            body {
                background: white;
            }

            .search-section,
            .print-btn,
            .portal-header {
                display: none;
            }

            .result-card {
                box-shadow: none;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div class="container-wrapper">
        <!-- Header -->
        <div class="portal-header">
            <h1><i class="fas fa-graduation-cap"></i> PU College Admission</h1>
            <p>Student Portal - Check Your Admission Status</p>
        </div>

        <!-- Body -->
        <div class="portal-body">
            <!-- Info Box -->
            <div class="info-box">
                <i class="fas fa-info-circle"></i>
                <p>Enter your Application Number to view your admission status and details.</p>
            </div>

            <!-- Search Section -->
            <div class="search-section">
                <label for="appNumber">Application Number</label>
                <div class="search-box">
                    <input type="text" 
                           id="appNumber" 
                           placeholder="Enter your application number (e.g., APP123456)"
                           onkeypress="handleKeyPress(event)">
                    <button onclick="searchStudent()">
                        <i class="fas fa-search"></i> Search
                    </button>
                </div>
            </div>

            <!-- Loader -->
            <div class="loader" id="loader">
                <div class="spinner"></div>
                <p>Searching for your application...</p>
            </div>

            <!-- Results Section -->
            <div class="results-section" id="resultsSection">
                <!-- Success Result -->
                <div id="successResult" style="display: none;">
                    <div class="result-card" id="resultCard"></div>
                </div>

                <!-- Error Result -->
                <div id="errorResult" style="display: none;">
                    <div class="error-message">
                        <i class="fas fa-exclamation-circle"></i>
                        <div>
                            <strong>Student Not Found</strong>
                            <p id="errorMessage" style="margin: 5px 0 0 0; font-size: 13px;"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="portal-footer">
            <p><i class="fas fa-lock"></i> Your data is secure and confidential | Last updated: <span id="lastUpdate">--</span></p>
        </div>
    </div>

    <script>
        /**
         * Handle Enter key press in search input
         */
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchStudent();
            }
        }

        /**
         * Search for student by application number
         */
        function searchStudent() {
            const appNumber = document.getElementById('appNumber').value.trim();

            // Validation
            if (!appNumber) {
                showError('Please enter an application number');
                return;
            }

            if (appNumber.length < 4) {
                showError('Application number must be at least 4 characters');
                return;
            }

            // Show loader
            showLoader();

            // Call Google Apps Script function
            google.script.run
                .withSuccessHandler(handleSearchSuccess)
                .withFailureHandler(handleSearchError)
                .getStudentDetails(appNumber);
        }

        /**
         * Handle successful search
         */
        function handleSearchSuccess(data) {
            hideLoader();

            if (data.error) {
                showError(data.error);
                return;
            }

            displayStudentResult(data);
        }

        /**
         * Handle search error
         */
        function handleSearchError(error) {
            hideLoader();
            showError('Error fetching data: ' + error);
            console.error('Search error:', error);
        }

        /**
         * Display student result
         */
        function displayStudentResult(student) {
            const resultsSection = document.getElementById('resultsSection');
            const successResult = document.getElementById('successResult');
            const errorResult = document.getElementById('errorResult');
            const resultCard = document.getElementById('resultCard');

            // Determine status
            const status = student.status || 'Registered';
            const statusClass = `status-${status.toLowerCase().replace(/\s+/g, '-')}`;

            // Build result HTML
            let html = `
                <div class="result-header">
                    <div>
                        <h2>${student.studentName || 'N/A'}</h2>
                    </div>
                    <div class="result-status">
                        <span class="status-badge ${statusClass}">${status}</span>
                    </div>
                </div>

                <div class="result-details">
                    <div class="detail-item">
                        <span class="detail-label">Application Number</span>
                        <span class="detail-value">${student.applicationNumber || 'N/A'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Merit Number</span>
                        <span class="detail-value">${student.meritNumber || 'N/A'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Total Marks</span>
                        <span class="detail-value">${student.marks || 'N/A'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Percentage</span>
                        <span class="detail-value">${student.percentage ? student.percentage.toFixed(2) + '%' : 'N/A'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Category</span>
                        <span class="detail-value">${student.category || 'N/A'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Gender</span>
                        <span class="detail-value">${student.gender || 'N/A'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Quota</span>
                        <span class="detail-value">${student.quota || 'N/A'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Allotted Section</span>
                        <span class="detail-value">${student.section || 'Pending'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Round</span>
                        <span class="detail-value">${student.round || 'N/A'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Admission Date</span>
                        <span class="detail-value">${student.admissionDate ? formatDate(student.admissionDate) : 'Pending'}</span>
                    </div>
                </div>
            `;

            // Add admission slip if admitted
            if (status === 'Admitted') {
                html += `
                    <div class="admission-slip">
                        <h3>Admission Slip</h3>
                        <div class="slip-row">
                            <span class="slip-label">Student Name:</span>
                            <span class="slip-value">${student.studentName || 'N/A'}</span>
                        </div>
                        <div class="slip-row">
                            <span class="slip-label">Application Number:</span>
                            <span class="slip-value">${student.applicationNumber || 'N/A'}</span>
                        </div>
                        <div class="slip-row">
                            <span class="slip-label">Merit Number:</span>
                            <span class="slip-value">${student.meritNumber || 'N/A'}</span>
                        </div>
                        <div class="slip-row">
                            <span class="slip-label">Section Allotted:</span>
                            <span class="slip-value">${student.section || 'N/A'}</span>
                        </div>
                        <div class="slip-row">
                            <span class="slip-label">Quota:</span>
                            <span class="slip-value">${student.quota || 'N/A'}</span>
                        </div>
                        <div class="slip-row">
                            <span class="slip-label">Admission Round:</span>
                            <span class="slip-value">Round ${student.round || 'N/A'}</span>
                        </div>
                        <div class="slip-row">
                            <span class="slip-label">Admission Date:</span>
                            <span class="slip-value">${student.admissionDate ? formatDate(student.admissionDate) : 'Pending'}</span>
                        </div>
                        <button class="print-btn" onclick="window.print()">
                            <i class="fas fa-print"></i> Print Admission Slip
                        </button>
                    </div>
                `;
            }

            resultCard.innerHTML = html;
            errorResult.style.display = 'none';
            successResult.style.display = 'block';
            resultsSection.classList.add('active');

            // Update last update time
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
        }

        /**
         * Show error message
         */
        function showError(message) {
            const resultsSection = document.getElementById('resultsSection');
            const errorResult = document.getElementById('errorResult');
            const successResult = document.getElementById('successResult');

            document.getElementById('errorMessage').textContent = message;
            successResult.style.display = 'none';
            errorResult.style.display = 'block';
            resultsSection.classList.add('active');
        }

        /**
         * Show loader
         */
        function showLoader() {
            document.getElementById('loader').classList.add('active');
            document.getElementById('resultsSection').classList.remove('active');
        }

        /**
         * Hide loader
         */
        function hideLoader() {
            document.getElementById('loader').classList.remove('active');
        }

        /**
         * Format date for display
         */
        function formatDate(dateValue) {
            if (!dateValue) return 'N/A';
            
            let date;
            if (typeof dateValue === 'string') {
                date = new Date(dateValue);
            } else if (typeof dateValue === 'number') {
                date = new Date(dateValue);
            } else if (dateValue instanceof Date) {
                date = dateValue;
            } else {
                return 'N/A';
            }

            if (isNaN(date.getTime())) return 'N/A';

            const options = { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            return date.toLocaleDateString('en-IN', options);
        }

        /**
         * Focus on search input when page loads
         */
        window.addEventListener('load', function() {
            document.getElementById('appNumber').focus();
        });
    </script>
</body>
</html>
